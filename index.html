
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | Infinity Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1>TIC TAC TOE</h1>
        <p class="subtitle">Challenge your mind. Own the board.</p>

        <div class="mode">
            <button id="pvp" class="selected">2 Players</button>
            <button id="ai">Play vs AI</button>
        </div>

        <div class="scoreboard">
            <div class="score">
                <span>PLAYER X</span>
                <strong id="scoreX">0</strong>
            </div>
            <div class="score">
                <span>DRAWS</span>
                <strong id="scoreD">0</strong>
            </div>
            <div class="score">
                <span id="labelO">PLAYER O</span>
                <strong id="scoreO">0</strong>
            </div>
        </div>

        <h2 id="status">Player X's turn</h2>
        <div class="board" id="board">
            <button class="cell" aria-label="Cell 1"></button>
            <button class="cell" aria-label="Cell 2"></button>
            <button class="cell" aria-label="Cell 3"></button>
            <button class="cell" aria-label="Cell 4"></button>
            <button class="cell" aria-label="Cell 5"></button>
            <button class="cell" aria-label="Cell 6"></button>
            <button class="cell" aria-label="Cell 7"></button>
            <button class="cell" aria-label="Cell 8"></button>
            <button class="cell" aria-label="Cell 9"></button>
        </div>

        <button id="restart" class="restart">↻ New Round</button>
        <p class="footer">Made for fun. Built to win.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
